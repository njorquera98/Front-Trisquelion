<section class="bg-neutral-50 dark:bg-neutral-900">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
    <a href="#" class="flex items-center mb-6 text-2xl font-semibold text-neutral-900 dark:text-white">
      <img class="w-8 h-8 mr-2" src="https://trisquelion.cl/wp-content/uploads/2025/01/trisquel12.png" alt="logo" />
      Trisquelion
    </a>
    <div
      class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-neutral-800 dark:border-neutral-700">
      <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1 class="text-xl font-bold leading-tight tracking-tight text-neutral-900 md:text-2xl dark:text-white">
          Iniciar Sesión
        </h1>
        <form class="space-y-4 md:space-y-6" (ngSubmit)="onSubmit()" #loginForm="ngForm">
          <div>
            <label for="email" class="block mb-2 text-sm font-medium text-neutral-900 dark:text-white">Correo</label>
            <input type="email" name="email" id="email" [(ngModel)]="email" required
              class="bg-neutral-50 border border-neutral-300 text-neutral-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-neutral-700 dark:border-neutral-600 dark:placeholder-neutral-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
              placeholder="nombre@trisquelion.cl" />
          </div>
          <div>
            <label for="password"
              class="block mb-2 text-sm font-medium text-neutral-900 dark:text-white">Contraseña</label>
            <input type="password" name="password" id="password" [(ngModel)]="password" required
              class="bg-neutral-50 border border-neutral-300 text-neutral-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-neutral-700 dark:border-neutral-600 dark:placeholder-neutral-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
              placeholder="••••••••" />
          </div>
          <button type="submit"
            class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
            Ingresar
          </button>

        </form>
      </div>
    </div>
  </div>
</section>
