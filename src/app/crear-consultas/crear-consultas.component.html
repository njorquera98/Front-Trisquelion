<form (ngSubmit)="guardar()">
  <div class="grid gap-4 mb-4 sm:grid-cols-3">
    <!-- Fecha -->
    <div>
      <label for="fecha" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Fecha</label>
      <input type="date" id="fecha" name="fecha" [(ngModel)]="nuevaConsulta.fecha"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
        required>
    </div>

    <!-- Hora -->
    <div>
      <label for="hora" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Hora</label>
      <input type="time" id="hora" name="hora" [(ngModel)]="nuevaConsulta.hora"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
        required>
    </div>

    <!-- Tipo de Consulta -->
    <div>
      <label for="tipoConsulta" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
        Tipo de Consulta
      </label>
      <select id="tipoConsulta" name="tipoConsulta" [(ngModel)]="nuevaConsulta.tipoConsulta"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
        required>
        <option value="" disabled selected>Seleccione un tipo</option>
        <option value="Primer Consulta">Primera Consulta</option>
        <option value="Control">Control</option>
        <option value="Seguimiento">Seguimiento</option>
        <option value="Otros">Otros</option>
      </select>
    </div>
  </div>
  <div class="grid gap-4 mb-4 ">
    <!-- Motivo -->
    <div class="sm:col-span-2">
      <label for="motivo" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Motivo</label>
      <textarea id="motivo" name="motivo" rows="2" [(ngModel)]="nuevaConsulta.motivo"
        class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
        placeholder="Escriba el motivo aquí" required></textarea>
    </div>

    <!-- Síntomas -->
    <div class="sm:col-span-2">
      <label for="sintomas" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Síntomas</label>
      <textarea id="sintomas" name="sintomas" rows="3" [(ngModel)]="nuevaConsulta.sintomas"
        class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
        placeholder="Escriba los síntomas aquí" required></textarea>
    </div>

    <!-- Síntomas -->
    <div class="sm:col-span-2">
      <label for="diagnostico" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Diagnostico</label>
      <textarea id="diagnostico" name="diagnostico" rows="3" [(ngModel)]="nuevaConsulta.diagnostico"
        class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
        placeholder="Escriba el diagnostico aquí" required></textarea>
    </div>


  </div>

  <!-- Botón de Guardar -->
  <button type="submit"
    class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
    Guardar Consulta
  </button>
</form>
