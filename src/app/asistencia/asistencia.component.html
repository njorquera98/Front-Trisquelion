<div class="max-w-full mx-auto p-4 bg-white rounded-lg shadow-lg dark:bg-neutral-800">
  <h2 class="text-xl md:text-2xl font-semibold text-neutral-900 dark:text-white text-center mb-4 md:mb-6">
    Asistencia semanal - {{ diaHoy }}
  </h2>

  <!-- Contenedor con scroll horizontal solo en pantallas muy pequeñas -->
  <div class="overflow-x-auto">
    <div
      class="flex flex-wrap gap-4 w-full min-w-[280px] justify-center mx-auto"
      style="min-width: auto;">
      <ng-container *ngFor="let dia of diasSemana">
        <div
          class="flex-grow min-w-[220px] max-w-[280px] border border-neutral-300 dark:border-neutral-600 rounded-lg p-3 shadow-sm flex flex-col"
        >
          <h3
            class="text-md md:text-lg font-semibold text-neutral-800 dark:text-white mb-3 border-b border-neutral-300 dark:border-neutral-600 pb-1 text-center"
          >
            {{ dia }}
          </h3>

          <ng-container
            *ngIf="horariosPorDia[dia] && horariosPorDia[dia].length > 0; else sinHorarios"
          >
            <ul class="space-y-2 max-h-64 overflow-y-auto">
              <li
                *ngFor="let horario of horariosPorDia[dia]"
                class="flex justify-between items-center border-b border-neutral-200 dark:border-neutral-700 py-1 last:border-b-0"
              >
                <div class="flex flex-col flex-grow max-w-[160px]">
                  <span
                    class="font-medium text-neutral-900 dark:text-white truncate text-sm"
                    title="{{ horario.nombre }}"
                  >
                    {{ horario.nombre }}
                  </span>
                  <span class="text-xs text-neutral-600 dark:text-neutral-400">
                    {{ horario.hora }}
                  </span>
                </div>
                <button
                  title="Registrar asistencia"
                  (click)="registrarAsistencia(horario)"
                  class="flex items-center text-blue-700 hover:text-white border border-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-xs px-3 py-1 transition whitespace-nowrap dark:border-blue-500 dark:text-blue-500 dark:hover:text-white dark:hover:bg-blue-500 dark:focus:ring-blue-800"
                >
                    Registrar
                </button>
              </li>
            </ul>
          </ng-container>

          <ng-template #sinHorarios>
            <p class="text-neutral-500 dark:text-neutral-400 text-center text-xs mt-4">
              No hay pacientes
            </p>
          </ng-template>
        </div>
      </ng-container>
    </div>
  </div>
</div>
