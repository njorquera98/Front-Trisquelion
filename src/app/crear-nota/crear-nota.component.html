<form (ngSubmit)="onSubmit()">
  <div class="grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label for="contenido">Contenido:</label>
      <textarea id="contenido" [(ngModel)]="contenido" name="contenido"
        class="block p-2.5 w-full text-sm text-neutral-900 bg-neutral-50 rounded-lg border border-neutral-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-neutral-700 dark:border-neutral-600 dark:placeholder-neutral-400 dark:text-white"
        placeholder="Escriba la descripción aquí" required></textarea>
    </div>
    <div>
      <label for="valor" class="block mb-2 text-sm font-medium text-neutral-900 dark:text-white">Fecha</label>
      <input type="date" id="fecha" name="fecha" [(ngModel)]="fecha"
        class="bg-neutral-50 border border-neutral-300 text-neutral-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-neutral-700 dark:border-neutral-600 dark:placeholder-neutral-400 dark:text-white"
        disabled>
    </div>
  </div>

  <button type="submit"
    class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
    {{ nota ? 'Actualizar Nota' : 'Crear Nota' }}
  </button>
</form>
