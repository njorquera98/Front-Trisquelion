<div class="bg-white dark:bg-neutral-800 p-6 rounded-lg shadow-lg">
  <div class="sticky top-0 z-10 bg-white dark:bg-neutral-800 pb-2">
    <h2 class="text-2xl font-semibold text-neutral-900 dark:text-white text-center mb-4">
      Documentos del Paciente
    </h2>
  </div>

  <div class="overflow-y-auto h-[calc(100vh-8rem)]">
    <div class="space-y-4">
      <div *ngFor="let documento of documentos"
        class="p-4 bg-neutral-50 dark:bg-neutral-700 rounded-lg shadow-md mb-4 border border-neutral-300 dark:border-neutral-600">
        <div class="flex justify-between items-start">
          <div class="flex flex-wrap gap-4 flex-1">
            <div class="flex-1 sm:w-1/3 min-w-[120px]">
              <p class="font-semibold text-neutral-700 dark:text-neutral-300">Folio</p>
              <p class="text-neutral-900 dark:text-white">{{ documento.folio }}</p>
            </div>
            <div class="flex-1 sm:w-1/3 min-w-[120px]">
              <p class="font-semibold text-neutral-700 dark:text-neutral-300">Fecha de Creación</p>
              <p class="text-neutral-900 dark:text-white">
                {{ documento.fecha_creacion | date: 'dd/MM/yyyy HH:mm' }}
              </p>

            </div>
          </div>
          <button type="button"
            class="text-red-700 border border-red-700 hover:bg-red-700 hover:text-white focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm p-2.5 text-center inline-flex items-center me-2 dark:border-red-500 dark:text-red-500 dark:hover:text-white dark:focus:ring-red-800 dark:hover:bg-red-500"
            (click)="descargarPDF(documento.codigo_validacion)">
            <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
              fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 13V4M7 14H5a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1h-2m-1-5-4 5-4-5m9 8h.01" />
            </svg>
            <span class="sr-only">Descargar PDF</span>
          </button>
        </div>
        <div class="mt-4">
          <p class="font-semibold text-neutral-700 dark:text-neutral-300">Diagnóstico</p>
          <p class="text-neutral-900 dark:text-white">{{ documento.consulta.diagnostico }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
