<!-- Modal principal: Confirmar asistencia -->
<div *ngIf="visible" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="relative bg-white dark:bg-neutral-800 rounded-xl shadow-xl p-6 w-[90%] max-w-md">
    <!-- Botón cerrar -->
    <button
      class="absolute top-3 right-3 text-neutral-400 hover:text-neutral-600 dark:hover:text-white transition"
      (click)="cerrarModal()"
      aria-label="Cerrar modal"
    >
      ✕
    </button>

    <!-- Título -->
    <h2 class="text-xl font-semibold text-center text-neutral-800 dark:text-white mb-4">
      Registrar asistencia
    </h2>

    <!-- Mensaje -->
    <p class="text-sm text-center text-neutral-600 dark:text-neutral-300 mb-6">
      ¿El paciente <strong>{{ nombrePaciente }}</strong> asistió a la sesión?
    </p>

    <!-- Botones -->
    <div class="grid grid-cols-2 sm:grid-cols-2 gap-3">
      <button
        (click)="emitirRespuesta('si')"
        class="w-full px-4 py-2 text-sm font-medium text-green-600 border border-green-600 rounded-lg hover:bg-green-600 hover:text-white transition"
      >
        Si Asiste
      </button>

      <button
        (click)="emitirRespuesta('reprogramar')"
        class="w-full px-4 py-2 text-sm font-medium text-yellow-500 border border-yellow-500 rounded-lg hover:bg-yellow-500 hover:text-white transition"
      >
        Reprogramar
      </button>

      <button
        (click)="emitirRespuesta('no')"
        class="w-full px-4 py-2 text-sm font-medium text-red-500 border border-red-500 rounded-lg hover:bg-red-500 hover:text-white transition"
      >
        No Asiste
      </button>

      <button
        (click)="emitirRespuesta('suspende')"
        class="w-full px-4 py-2 text-sm font-medium text-red-500 border border-red-500 rounded-lg hover:bg-red-500 hover:text-white transition"
      >
        Suspende
      </button>
    </div>
  </div>
</div>

<!-- Modal de Reprogramación -->
<div *ngIf="mostrarModalReprogramar" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="relative bg-white dark:bg-neutral-800 rounded-xl shadow-xl p-6 w-[90%] max-w-md">
    <!-- Botón cerrar -->
    <button
      class="absolute top-3 right-3 text-neutral-400 hover:text-neutral-600 dark:hover:text-white transition"
      (click)="cancelarReprogramacion()"
      aria-label="Cerrar modal"
    >
      ✕
    </button>

    <!-- Título -->
    <h2 class="text-xl font-semibold text-center text-neutral-800 dark:text-white mb-4">
      Reprogramar sesión
    </h2>

    <!-- Inputs -->
    <div class="mb-4">
      <label for="fecha" class="block mb-1 text-sm font-medium text-neutral-700 dark:text-neutral-200">Nueva fecha</label>
      <input
        id="fecha"
        type="date"
        [(ngModel)]="fechaReprogramada"
        class="w-full border border-neutral-300 dark:border-neutral-600 bg-white dark:bg-neutral-700 text-neutral-900 dark:text-white rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400"
      />
    </div>

    <div class="mb-6">
      <label for="hora" class="block mb-1 text-sm font-medium text-neutral-700 dark:text-neutral-200">Nueva hora</label>
      <input
        id="hora"
        type="time"
        [(ngModel)]="horaReprogramada"
        class="w-full border border-neutral-300 dark:border-neutral-600 bg-white dark:bg-neutral-700 text-neutral-900 dark:text-white rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400"
      />
    </div>

    <!-- Botones -->
    <div class="flex justify-end gap-3">
      <button
        (click)="cancelarReprogramacion()"
        class="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 border border-gray-300 dark:border-gray-500 rounded-lg hover:bg-gray-100 dark:hover:bg-neutral-700"
      >
        Cancelar
      </button>

      <button
        (click)="confirmarReprogramacion()"
        class="px-4 py-2 text-sm font-medium text-blue-600 dark:text-blue-400 border border-blue-600 dark:border-blue-400 rounded-lg hover:bg-blue-600 hover:text-white dark:hover:bg-blue-500"
      >
        Confirmar
      </button>
    </div>
  </div>
</div>
