<div *ngIf="visible" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white dark:bg-neutral-800 rounded-lg shadow-lg p-6 w-[90%] max-w-sm">
    <h2 class="text-lg font-semibold text-center text-neutral-800 dark:text-white mb-4">
      Registrar asistencia
    </h2>
    <p class="text-sm text-center text-neutral-700 dark:text-neutral-300 mb-6">
      ¿El paciente <strong>{{ nombrePaciente }}</strong> asistió a la sesión?
    </p>
    <div class="flex justify-between gap-2">
      <button (click)="emitirRespuesta('reprogramar')"
        class="w-full px-4 py-2 text-sm bg-yellow-500 hover:bg-yellow-600 text-white rounded">
        Reprogramar
      </button>
      <button (click)="emitirRespuesta('no')"
        class="w-full px-4 py-2 text-sm bg-red-500 hover:bg-red-600 text-white rounded">
        No asistió
      </button>
      <button (click)="emitirRespuesta('si')"
        class="w-full px-4 py-2 text-sm bg-green-600 hover:bg-green-700 text-white rounded">
        Asistió
      </button>
    </div>
    <button class="absolute top-2 right-3 text-neutral-500 hover:text-neutral-700" (click)="cerrarModal()">
      ✕
    </button>
  </div>
</div>
