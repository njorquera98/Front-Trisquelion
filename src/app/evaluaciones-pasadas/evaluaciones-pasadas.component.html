<div *ngIf="evaluaciones.length > 0; else noEvaluacion" class="p-4 space-y-6">
  <!-- Contenedor con scroll para las evaluaciones -->
  <div class="max-h-96 overflow-y-auto"> <!-- Ajusta la altura máxima según sea necesario -->
    <div *ngFor="let evaluacion of evaluaciones"
      class="p-4 bg-neutral-50 dark:bg-neutral-700 rounded-lg shadow-md border border-neutral-300 dark:border-neutral-600 mb-4">
      <!-- Aquí se agrega el margen -->

      <!-- Fecha de Ingreso -->
      <p class="text-neutral-900 dark:text-white">
        <span class="font-semibold text-neutral-700 dark:text-neutral-300">Fecha de Ingreso:</span> {{
        evaluacion.fechaIngreso
        | date }}
      </p>

      <!-- Objetivo -->
      <p class="text-neutral-900 dark:text-white">
        <span class="font-semibold text-neutral-700 dark:text-neutral-300">Objetivo:</span> {{ evaluacion.objetivo }}
      </p>

      <!-- Diagnóstico -->
      <p class="text-neutral-900 dark:text-white">
        <span class="font-semibold text-neutral-700 dark:text-neutral-300">Diagnóstico:</span> {{ evaluacion.diagnostico
        }}
      </p>

      <!-- Anamnesis -->
      <p class="text-neutral-900 dark:text-white">
        <span class="font-semibold text-neutral-700 dark:text-neutral-300">Anamnesis:</span> {{ evaluacion.anamnesis }}
      </p>

    </div>
  </div>
</div>

<!-- Si no hay evaluaciones -->
<ng-template #noEvaluacion>
  <div
    class="p-4 bg-neutral-50 dark:bg-neutral-700 rounded-lg shadow-md border border-neutral-300 dark:border-neutral-600">
    <p class="text-neutral-900 dark:text-white">No se han encontrado evaluaciones pasadas para este paciente.</p>
  </div>
</ng-template>
